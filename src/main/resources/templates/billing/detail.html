<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: shell(~{::title}, ~{::main})}">
<head>
  <title th:text="'Bill #' + ${bill.billNumber} + ' — Bullet Beats Café'">Bill</title>
</head>
<body>
<main class="p-6">

  <!-- Header row -->
  <div class="flex flex-wrap items-start justify-between gap-y-3 mb-6 max-w-7xl mx-auto">
    <div>
      <a href="/bills"
         class="inline-flex items-center gap-1.5 text-sand text-sm hover:text-ivory transition-colors mb-2">
        ← All Bills
      </a>
      <h1 class="font-heading text-2xl text-ivory tracking-wide"
          th:text="'Bill #' + ${bill.billNumber}"></h1>
      <p class="text-sand text-sm mt-0.5"
         th:text="${bill.cafeTable != null ? bill.cafeTable.name : bill.orderType.displayName}
                  + (${bill.customer != null} ? ' · ' + ${bill.customer.name} : ' · Walk-in')
                  + (${bill.createdAt != null} ? ' · ' + ${#temporals.format(bill.createdAt, 'dd MMM, HH:mm')} : '')">
      </p>
    </div>
    <!-- Header actions (manager+) -->
    <div class="flex items-center gap-2" sec:authorize="hasAnyRole('MANAGER','ADMIN')">
      <!-- Transfer Table button (dine-in only) -->
      <div id="bill-transfer-btn">
        <button th:if="${bill.cafeTable != null and (bill.status.name() == 'DRAFT' or bill.status.name() == 'CONFIRMED')}"
                th:attr="hx-get=@{/bills/{id}/transfer-form(id=${bill.id})}"
                hx-target="#transfer-panel"
                hx-swap="innerHTML"
                class="px-3 py-1.5 text-xs rounded border border-sand/30 text-sand
                       hover:border-ivory/40 hover:text-ivory transition-colors">
          Transfer Table
        </button>
      </div>
      <!-- Cancel button -->
      <div id="bill-cancel-btn">
        <form th:if="${bill.status.name() == 'DRAFT' or bill.status.name() == 'CONFIRMED'}"
              th:action="@{/bills/{id}/cancel(id=${bill.id})}" method="post"
              onsubmit="return bbConfirm(this, 'Cancel this bill?')">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit"
                  class="px-3 py-1.5 text-xs rounded border border-red-500/40 text-red-400
                         hover:bg-red-500/10 transition-colors">
            Cancel Bill
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Transfer panel (populated by HTMX) -->
  <div id="transfer-panel" class="max-w-7xl mx-auto"></div>

  <!-- Two-column layout -->
  <div class="grid grid-cols-1 lg:grid-cols-[1fr_380px] gap-6 items-start max-w-7xl mx-auto">

    <!-- ── LEFT: persistent container; content switches between menu and kitchen ── -->
    <div id="detail-left-col" class="order-2 lg:order-1">

      <!-- DRAFT: poll for DRAFT→CONFIRMED transition + menu browser -->
      <th:block th:if="${bill.status.name() == 'DRAFT'}">

        <!-- h-0 so HTMX won't pause the every-trigger (display:none would pause it) -->
        <div th:attr="hx-get=@{/bills/{id}/left-panel(id=${bill.id})}"
             hx-trigger="every 5s"
             hx-target="#detail-left-col"
             hx-swap="innerHTML"
             class="h-0 overflow-hidden pointer-events-none" aria-hidden="true"></div>

        <!-- Search: client-side (all items already rendered below), no server round trip -->
        <div class="mb-3">
          <input type="text" id="billing-search-input"
                 placeholder="Search menu items..."
                 class="w-full bg-surface rounded-lg px-4 py-2.5 text-ivory text-sm
                        placeholder-sand/40 outline-none border border-elevated/60
                        focus:border-accent focus:shadow-neon-sm transition-all duration-200"
                 oninput="billingOnSearchInput(this)"
                 name="q"/>
        </div>

        <!-- Category tabs: client-side show/hide, no server round trip -->
        <div class="flex flex-wrap gap-2 mb-4">
          <button type="button" id="billing-tab-all"
                  onclick="billingSelectCategory(this, null)"
                  class="cat-tab px-3 py-1.5 text-xs rounded-lg border border-accent/40 text-accent
                         bg-accent/10 hover:bg-accent/20 transition-colors">
            All
          </button>
          <button th:each="cat : ${categories}"
                  th:id="'billing-tab-' + ${cat.id}"
                  th:text="${cat.name}"
                  th:onclick="'billingSelectCategory(this, ' + ${cat.id} + ')'"
                  type="button"
                  class="cat-tab px-3 py-1.5 text-xs rounded-lg border border-elevated/60 text-sand
                         hover:border-accent/40 hover:text-ivory transition-colors">
          </button>
        </div>

        <!-- Menu grid -->
        <div id="menu-items-grid">
          <th:block th:replace="~{billing/fragments/menu-grid :: menu-grid}"/>
        </div>

      </th:block>

      <!-- CONFIRMED: kitchen order view -->
      <th:block th:if="${bill.status.name() == 'CONFIRMED'}">
        <th:block th:replace="~{billing/fragments/kitchen-left-col :: kitchen-left-col}"/>
      </th:block>

    </div>

    <!-- ── RIGHT: Bill panel ──────────────────────────────────────────── -->
    <div id="bill-panel" class="space-y-0 order-1 lg:order-2">
      <th:block th:replace="~{billing/fragments/bill-panel :: bill-panel}"/>
    </div>

  </div>

  <!-- Customer feedback (full width, below grid) -->
  <div th:unless="${#lists.isEmpty(feedbackRequests)}" class="max-w-7xl mx-auto mt-8">
    <div class="bg-surface rounded-xl border border-elevated/60 overflow-hidden">
      <div class="px-4 py-3 border-b border-elevated/60">
        <h2 class="font-heading text-base text-ivory tracking-wide">Customer Feedback</h2>
      </div>
      <div class="px-4 py-4 space-y-4">
        <div th:each="r : ${feedbackRequests}"
             th:with="expired=${r.status.name() == 'PENDING' and r.expiresAt.isBefore(T(java.time.LocalDateTime).now())}"
             class="border-b border-elevated/40 last:border-0 pb-4 last:pb-0">

          <div class="flex items-center justify-between gap-3 mb-1.5">
            <span class="px-2 py-0.5 text-xs border rounded-full font-bold"
                  th:classappend="${r.status.name() == 'RECEIVED'} ? 'text-emerald-400 border-emerald-400/40 bg-emerald-400/10' :
                                 (${expired} ? 'text-sand border-sand/40 bg-sand/10' :
                                               'text-amber-400 border-amber-400/40 bg-amber-400/10')"
                  th:text="${r.status.name() == 'RECEIVED'} ? 'Received' : (${expired} ? 'Expired' : 'Pending')">
            </span>
            <span class="text-sand text-xs"
                  th:text="'Requested ' + ${#temporals.format(r.requestedAt, 'dd MMM yyyy, HH:mm')}"></span>
          </div>

          <p th:if="${r.responseBody != null}"
             class="text-ivory text-sm whitespace-pre-wrap break-words"
             th:text="${r.responseBody}"></p>
          <p th:unless="${r.responseBody != null}"
             class="text-sand/60 text-sm italic">No reply yet.</p>

          <p th:if="${r.respondedAt != null}" class="text-sand text-xs mt-1"
             th:text="'Replied ' + ${#temporals.format(r.respondedAt, 'dd MMM yyyy, HH:mm')}"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Activity log (full width, below grid) -->
  <div class="max-w-7xl mx-auto mt-8">
    <div class="bg-surface rounded-xl border border-elevated/60 overflow-hidden">
      <div class="px-4 py-3 border-b border-elevated/60">
        <h2 class="font-heading text-base text-ivory tracking-wide">Activity Log</h2>
      </div>
      <div class="px-4 py-4"
           id="activity-log-wrap"
           th:attr="hx-get=@{/bills/{id}/activity-log(id=${bill.id})}"
           hx-trigger="every 10s"
           hx-target="#activity-log-inner"
           hx-swap="outerHTML">
        <th:block th:replace="~{billing/fragments/activity-log :: activity-log}"/>
      </div>
    </div>
  </div>

  <script>
    // Collapsible subcategory sections in the menu picker
    function toggleSubcat(id) {
      var body = document.getElementById('subcat-body-' + id);
      var chev = document.getElementById('subcat-chevron-' + id);
      if (body) body.classList.toggle('hidden');
      if (chev) chev.classList.toggle('rotate-180');
    }

    // Category tab active-state styling
    function billingSetActiveTab(el) {
      document.querySelectorAll('.cat-tab').forEach(function (t) {
        t.classList.remove('border-accent/40', 'text-accent', 'bg-accent/10', 'hover:bg-accent/20');
        t.classList.add('border-elevated/60', 'text-sand', 'hover:border-accent/40', 'hover:text-ivory');
      });
      el.classList.add('border-accent/40', 'text-accent', 'bg-accent/10', 'hover:bg-accent/20');
      el.classList.remove('border-elevated/60', 'text-sand', 'hover:border-accent/40', 'hover:text-ivory');
    }

    // Category tab click: every category's items were already rendered into #menu-items-grid
    // on initial page load, so switching tabs is a pure client-side show/hide — no server
    // round trip needed.
    function billingSelectCategory(el, categoryId) {
      billingSetActiveTab(el);
      var input = document.getElementById('billing-search-input');
      if (input) input.value = '';
      billingApplySearch(''); // undo any client-side search filtering before re-applying the tab filter
      document.querySelectorAll('#menu-items-grid > .menu-cat-section').forEach(function (sec) {
        var match = (categoryId === null) || (String(sec.dataset.categoryId) === String(categoryId));
        sec.style.display = match ? '' : 'none';
        var header = sec.querySelector('.menu-cat-header');
        if (header) header.style.display = (match && categoryId !== null) ? 'none' : '';
      });
    }

    // Client-side search: filters the already-rendered .menu-item cards by name
    // (case-insensitive substring, matching the old server query) — no network round trip.
    // Hides now-empty subcategory/category groups, and hides every header while searching
    // for a flat, ungrouped look (matching what the old server-rendered search results looked like).
    function billingApplySearch(query) {
      var q = (query || '').trim().toLowerCase();
      var searching = q.length > 0;
      var grid = document.getElementById('menu-items-grid');
      if (!grid) return;
      var anyMatch = false;
      grid.querySelectorAll('.menu-item').forEach(function (item) {
        var match = !searching || (item.dataset.itemName || '').toLowerCase().indexOf(q) !== -1;
        item.style.display = match ? '' : 'none';
        if (match) anyMatch = true;
      });
      function hasVisibleItem(el) {
        return Array.prototype.some.call(el.querySelectorAll('.menu-item'), function (i) {
          return i.style.display !== 'none';
        });
      }
      grid.querySelectorAll('.menu-items-group').forEach(function (grp) {
        grp.style.display = hasVisibleItem(grp) ? '' : 'none';
      });
      grid.querySelectorAll('.menu-cat-section').forEach(function (sec) {
        sec.style.display = hasVisibleItem(sec) ? '' : 'none';
      });
      grid.querySelectorAll('.menu-cat-header, .menu-subcat-header').forEach(function (h) {
        h.style.display = searching ? 'none' : '';
      });
      if (searching) {
        grid.querySelectorAll('[id^="subcat-body-"]').forEach(function (b) {
          b.classList.remove('hidden');
        });
      }
      var emptyEl = document.getElementById('billing-search-empty');
      if (emptyEl) emptyEl.style.display = (searching && !anyMatch) ? '' : 'none';
    }

    // Search box: deselect category tabs while searching, restore "All" once cleared,
    // and run the client-side filter.
    function billingOnSearchInput(el) {
      if (el.value) {
        document.querySelectorAll('.cat-tab').forEach(function (t) {
          t.classList.remove('border-accent/40', 'text-accent', 'bg-accent/10', 'hover:bg-accent/20');
          t.classList.add('border-elevated/60', 'text-sand', 'hover:border-accent/40', 'hover:text-ivory');
        });
      } else {
        var allTab = document.getElementById('billing-tab-all');
        if (allTab) billingSetActiveTab(allTab);
      }
      billingApplySearch(el.value);
    }
  </script>

</main>
</body>
</html>
