<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{::title}, ~{::main})}">
<head>
  <title>Delivery Order QR — Bullet Beats Café</title>
</head>
<body>
<main class="p-6 max-w-xl mx-auto">

  <div class="mb-7">
    <h1 class="font-heading text-3xl text-ivory tracking-wide">Delivery Order QR</h1>
    <p class="text-sand text-sm mt-0.5">Print this and put it up outside the café, or share the link directly.</p>
  </div>

  <div class="bg-surface rounded-xl border border-elevated/60 p-6">
    <div class="flex items-start gap-6 flex-wrap">
      <img src="/admin/delivery/qr"
           width="200" height="200"
           class="rounded-lg border border-elevated/60 bg-white p-2"
           alt="Delivery Order QR Code"/>

      <div class="flex flex-col gap-3 pt-1 min-w-0">
        <a href="/admin/delivery/qr/download"
           class="inline-flex items-center gap-2 px-4 py-2 text-sm rounded-lg
                  border border-accent/40 text-accent hover:bg-accent/10 transition-colors w-fit">
          Download PNG
        </a>

        <div class="text-xs text-sand">
          <p class="uppercase tracking-widest text-sand/60 mb-1">Link</p>
          <p class="font-mono text-ivory break-all select-all" th:text="${orderUrl}">https://example.com/order</p>
        </div>

        <p class="text-sand/60 text-xs max-w-64">
          Anyone who scans this or visits the link can place a direct delivery order.
          Placed orders show up in <a href="/bills" class="text-accent hover:underline">Billing</a>
          with the "Direct Delivery" tag.
        </p>
      </div>
    </div>
  </div>

</main>
</body>
</html>
