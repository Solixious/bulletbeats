<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="menu-grid">
  <div th:if="${#lists.isEmpty(items) and #lists.isEmpty(subcategoryGroups) and #lists.isEmpty(groupedMenu)}"
       class="py-12 text-center text-sand text-sm">
    No items found.
  </div>

  <!-- Grouped view ("All" tab): every category, sorted by category then subcategory -->
  <th:block th:each="dto : ${groupedMenu}">
    <div class="mb-5">
      <h3 class="font-heading text-sm text-sand tracking-widest uppercase mb-2"
          th:text="${dto.category.name}">Category</h3>
      <div th:unless="${#lists.isEmpty(dto.items)}" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <th:block th:each="item : ${dto.items}">
          <th:block th:replace="~{billing/fragments/menu-grid :: menu-item(item=${item},billId=${billId})}"/>
        </th:block>
      </div>
      <th:block th:each="sub : ${dto.subcategories}">
        <button type="button"
                class="w-full flex items-center justify-between gap-2 mt-3 mb-2 cursor-pointer select-none"
                th:attr="onclick=|toggleSubcat(${sub.subcategory.id})|">
          <h4 class="font-heading text-xs text-sand/80 tracking-widest uppercase"
              th:text="${sub.subcategory.name}">Subcategory</h4>
          <span th:id="'subcat-chevron-' + ${sub.subcategory.id}"
                class="text-sand/60 transition-transform duration-200 text-xs leading-none">▼</span>
        </button>
        <div th:id="'subcat-body-' + ${sub.subcategory.id}" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
          <th:block th:each="item : ${sub.items}">
            <th:block th:replace="~{billing/fragments/menu-grid :: menu-item(item=${item},billId=${billId})}"/>
          </th:block>
        </div>
      </th:block>
    </div>
  </th:block>

  <!-- Flat view (single category filter / search) -->
  <div th:unless="${#lists.isEmpty(items)}"
       class="grid grid-cols-2 sm:grid-cols-3 gap-3">
    <th:block th:each="item : ${items}">
      <th:block th:replace="~{billing/fragments/menu-grid :: menu-item(item=${item},billId=${billId})}"/>
    </th:block>
  </div>
  <th:block th:each="sub : ${subcategoryGroups}">
    <button type="button"
            class="w-full flex items-center justify-between gap-2 mt-3 mb-2 cursor-pointer select-none"
            th:attr="onclick=|toggleSubcat(${sub.subcategory.id})|">
      <h4 class="font-heading text-xs text-sand/80 tracking-widest uppercase"
          th:text="${sub.subcategory.name}">Subcategory</h4>
      <span th:id="'subcat-chevron-' + ${sub.subcategory.id}"
            class="text-sand/60 transition-transform duration-200 text-xs leading-none">▼</span>
    </button>
    <div th:id="'subcat-body-' + ${sub.subcategory.id}" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
      <th:block th:each="item : ${sub.items}">
        <th:block th:replace="~{billing/fragments/menu-grid :: menu-item(item=${item},billId=${billId})}"/>
      </th:block>
    </div>
  </th:block>
</th:block>

<!-- ── Single item card (reused by grouped and flat views) ───────────── -->
<th:block th:fragment="menu-item(item, billId)">

  <!-- Available: clickable form-card -->
  <form th:if="${item.isAvailable}"
        th:attr="hx-post=@{/bills/{id}/items(id=${billId})}"
        hx-target="#bill-panel"
        hx-swap="innerHTML">
    <input type="hidden" name="menuItemId" th:value="${item.id}"/>
    <input type="hidden" name="quantity" value="1"/>
    <button type="submit"
            class="w-full text-left p-3 rounded-xl border border-elevated/60 bg-surface
                   hover:border-accent/50 hover:bg-elevated/60 active:scale-95
                   transition-all duration-150 cursor-pointer group">
      <div th:if="${item.imagePath != null}" class="mb-2 overflow-hidden rounded-lg h-20">
        <img th:src="${(item.thumbnailPath != null ? item.thumbnailPath : item.imagePath) + '?v=' + item.imageVersion}"
             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-200"
             th:alt="${item.name}"/>
      </div>
      <div class="flex items-center gap-2">
        <span th:replace="~{fragments/dish-type-mark :: mark(${item.dishType})}"></span>
        <p class="text-ivory text-xs font-medium leading-tight" th:text="${item.name}"></p>
      </div>
      <p th:if="${item.quantityLabel != null and !#strings.isEmpty(item.quantityLabel)}"
         class="text-sand text-[10px] mt-0.5" th:text="${item.quantityLabel}"></p>
      <p class="text-accent text-xs font-bold mt-1"
         th:text="'₹' + ${#numbers.formatDecimal(item.price, 1, 2)}"></p>
    </button>
  </form>

  <!-- Unavailable: greyed out, non-clickable -->
  <div th:unless="${item.isAvailable}"
       class="text-left p-3 rounded-xl border border-elevated/40 bg-surface/50 opacity-50 cursor-not-allowed">
    <div th:if="${item.imagePath != null}" class="mb-2 overflow-hidden rounded-lg h-20">
      <img th:src="${(item.thumbnailPath != null ? item.thumbnailPath : item.imagePath) + '?v=' + item.imageVersion}"
           class="w-full h-full object-cover grayscale"
           th:alt="${item.name}"/>
    </div>
    <div class="flex items-center gap-2">
      <span th:replace="~{fragments/dish-type-mark :: mark(${item.dishType})}"></span>
      <p class="text-sand text-xs font-medium leading-tight" th:text="${item.name}"></p>
    </div>
    <p th:if="${item.quantityLabel != null and !#strings.isEmpty(item.quantityLabel)}"
       class="text-sand/70 text-[10px] mt-0.5" th:text="${item.quantityLabel}"></p>
    <p class="text-sand text-xs mt-1"
       th:text="'₹' + ${#numbers.formatDecimal(item.price, 1, 2)}"></p>
    <!-- auto-mode unavailable = low inventory; admin-forced unavailable = Unavailable -->
    <p th:if="${item.availabilityOverride == null}"
       class="text-amber-500/80 text-xs mt-0.5">Low inventory</p>
    <p th:unless="${item.availabilityOverride == null}"
       class="text-red-400/70 text-xs mt-0.5">Unavailable</p>
  </div>

</th:block>
</body>
</html>
