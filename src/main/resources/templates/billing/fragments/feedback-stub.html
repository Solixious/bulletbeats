<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="feedback-stub">
  <div th:if="${error}"
       class="px-3 py-2 rounded-lg border border-red-400/20 bg-red-400/5 text-red-400/80 text-xs"
       th:text="${error}">
  </div>
  <div th:unless="${error}"
       class="px-3 py-2 rounded-lg border border-emerald-400/20 bg-emerald-400/5 text-emerald-400/80 text-xs">
    Feedback request sent. We'll capture the customer's reply automatically.
  </div>
</th:block>
</body>
</html>
