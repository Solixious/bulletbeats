<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="conversation-list">

  <th:block th:each="conv : ${conversations}">
    <button th:attr="hx-get=@{/whatsapp/inbox/thread(number=${conv.fromNumber})},
                    data-number=${conv.fromNumber}"
            hx-target="#thread-panel"
            hx-swap="innerHTML"
            class="conv-btn w-full text-left px-4 py-3 hover:bg-elevated/50
                   transition-colors duration-150 border-b border-elevated/30">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1.5">
            <span th:if="${conv.customerId != null}"
                  class="w-1.5 h-1.5 rounded-full bg-green-400 flex-shrink-0"></span>
            <span th:if="${conv.customerId == null}"
                  class="w-1.5 h-1.5 rounded-full bg-sand/40 flex-shrink-0"></span>
            <p class="text-sm font-medium truncate"
               th:classappend="${conv.unreadCount > 0} ? 'text-ivory' : 'text-sand'"
               th:text="${conv.displayName}"></p>
          </div>
          <p class="text-xs text-sand/70 truncate mt-0.5 pl-3"
             th:text="${conv.lastMessage != null ? conv.lastMessage : '(media)'}"></p>
        </div>
        <div class="flex-shrink-0 flex flex-col items-end gap-1">
          <p class="text-xs text-sand/60"
             th:text="${#temporals.format(conv.lastReceivedAt, 'dd MMM')}"></p>
          <!-- Amber unread badge -->
          <span th:if="${conv.unreadCount > 0}"
                th:text="${conv.unreadCount}"
                class="min-w-[1.25rem] h-5 px-1 rounded-full text-xs font-bold
                       flex items-center justify-center
                       bg-amber-400/20 text-amber-400 border border-amber-400/50">
          </span>
        </div>
      </div>
    </button>
  </th:block>

  <div th:if="${conversations.isEmpty()}"
       class="px-4 py-10 text-center">
    <p class="text-sand text-sm">No messages yet</p>
    <p class="text-sand/50 text-xs mt-1">
      Point your Twilio webhook to<br>
      <code class="text-accent/70">/webhook/whatsapp</code>
    </p>
  </div>

</th:block>

</body>
</html>
