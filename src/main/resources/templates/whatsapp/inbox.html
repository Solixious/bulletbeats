<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{::title}, ~{::main})}">
<head>
  <title>WhatsApp Inbox — Bullet Beats Café</title>
</head>
<body>
<main class="h-full flex overflow-hidden">

  <!-- ── Conversation list ──────────────────────────────────────── -->
  <div class="w-72 flex-shrink-0 border-r border-elevated/60 flex flex-col overflow-hidden bg-surface">

    <div class="px-4 py-4 border-b border-elevated/60 flex-shrink-0">
      <h2 class="font-heading text-xl text-ivory tracking-wide">WhatsApp Inbox</h2>
      <p class="text-xs text-sand mt-0.5">Incoming customer messages</p>
    </div>

    <!-- SSE wrapper — connection lives as long as the sidebar is in the DOM -->
    <div hx-ext="sse" sse-connect="/whatsapp/inbox/events"
         class="flex-1 overflow-y-auto flex flex-col min-h-0">
      <div id="conversation-list"
           hx-get="/whatsapp/inbox/conversations"
           hx-trigger="sse:newMessage"
           hx-swap="innerHTML"
           class="flex-1">
        <th:block th:replace="~{whatsapp/fragments/conversation-list :: conversation-list}"></th:block>
      </div>
    </div>

  </div>

  <!-- ── Thread panel ───────────────────────────────────────────── -->
  <div class="flex-1 flex flex-col overflow-hidden" id="thread-panel">
    <div class="flex-1 flex items-center justify-center">
      <div class="text-center">
        <p class="text-4xl mb-3">💬</p>
        <p class="text-ivory text-sm font-medium">Select a conversation</p>
        <p class="text-sand text-xs mt-1">Messages will auto-refresh every 8 seconds</p>
      </div>
    </div>
  </div>

  <script>
    // ── Conversation highlight ────────────────────────────────────
    var _selectedNumber = null;

    // Capture the selected number when a conversation button is clicked
    document.addEventListener('htmx:beforeRequest', function(e) {
      var btn = e.target.closest
              ? e.target.closest('#conversation-list button[data-number]')
              : null;
      if (!btn) return;
      _selectedNumber = btn.dataset.number;
      // Clear all highlights, then mark this one immediately
      document.querySelectorAll('#conversation-list button[data-number]').forEach(function(b) {
        b.style.borderLeft = '';
        b.style.backgroundColor = '';
      });
      btn.style.borderLeft = '3px solid #00D4FF';
      btn.style.backgroundColor = 'rgba(51,51,51,0.7)';
    });

    // Re-apply highlight after the conversation list is refreshed via SSE
    document.addEventListener('htmx:afterSwap', function(e) {
      if (!e.detail.target || e.detail.target.id !== 'conversation-list') return;
      if (!_selectedNumber) return;
      var btn = document.querySelector(
        '#conversation-list button[data-number="' + _selectedNumber + '"]'
      );
      if (btn) {
        btn.style.borderLeft = '3px solid #00D4FF';
        btn.style.backgroundColor = 'rgba(51,51,51,0.7)';
      }
    });

    // ── Messages scroll position ──────────────────────────────────
    // Record whether the user is near the bottom BEFORE a poll swap,
    // so the messages-body script can decide whether to scroll down.
    if (!window._waScrollHandlerSet) {
      window._waScrollHandlerSet = true;
      document.addEventListener('htmx:beforeSwap', function(e) {
        if (!e.detail.target || e.detail.target.id !== 'messages-scroll') return;
        var el = e.detail.target;
        el.dataset.wasNearBottom =
          String(el.scrollHeight - el.scrollTop - el.clientHeight < 80);
      });
    }
  </script>

</main>
</body>
</html>
