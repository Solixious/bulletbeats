<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<!-- ── Full grid (returned by category filter endpoint) ─────────────── -->
<th:block th:fragment="delivery-menu-grid">
  <div th:if="${#lists.isEmpty(items) and #lists.isEmpty(subcategoryGroups) and #lists.isEmpty(categories)}"
       class="py-16 text-center text-sand text-sm">
    No items available in this category.
  </div>

  <!-- Grouped view ("All" tab): every category, sorted by category then subcategory -->
  <th:block th:each="dto : ${categories}">
    <div class="mb-6">
      <h3 class="font-heading text-xl text-sand tracking-widest mb-3 uppercase"
          th:text="${dto.category.name}">Category</h3>
      <div th:unless="${#lists.isEmpty(dto.items)}" class="space-y-3">
        <th:block th:each="item : ${dto.items}">
          <th:block th:replace="~{delivery/fragments/menu-grid :: delivery-menu-item(item=${item},bill=${bill},billId=${billId},customerName=${customerName},locked=${locked})}"/>
        </th:block>
      </div>
      <th:block th:each="sub : ${dto.subcategories}">
        <button type="button"
                class="w-full flex items-center justify-between gap-2 mt-4 mb-2 pl-2 border-l-2 border-accent/40 cursor-pointer select-none"
                th:attr="onclick=|toggleSubcat(${sub.subcategory.id})|">
          <h4 class="font-heading text-base text-sand/80 tracking-widest uppercase"
              th:text="${sub.subcategory.name}">Subcategory</h4>
          <span th:id="'subcat-chevron-' + ${sub.subcategory.id}"
                class="text-sand/60 transition-transform duration-200 text-xs leading-none flex-shrink-0 mr-2">▼</span>
        </button>
        <div th:id="'subcat-body-' + ${sub.subcategory.id}" class="space-y-3">
          <th:block th:each="item : ${sub.items}">
            <th:block th:replace="~{delivery/fragments/menu-grid :: delivery-menu-item(item=${item},bill=${bill},billId=${billId},customerName=${customerName},locked=${locked})}"/>
          </th:block>
        </div>
      </th:block>
    </div>
  </th:block>

  <!-- Flat view (single category filter active) -->
  <div th:unless="${#lists.isEmpty(items)}" class="space-y-3">
    <th:block th:each="item : ${items}">
      <th:block th:replace="~{delivery/fragments/menu-grid :: delivery-menu-item(item=${item},bill=${bill},billId=${billId},customerName=${customerName},locked=${locked})}"/>
    </th:block>
  </div>
  <th:block th:each="sub : ${subcategoryGroups}">
    <button type="button"
            class="w-full flex items-center justify-between gap-2 mt-4 mb-2 pl-2 border-l-2 border-accent/40 cursor-pointer select-none"
            th:attr="onclick=|toggleSubcat(${sub.subcategory.id})|">
      <h4 class="font-heading text-base text-sand/80 tracking-widest uppercase"
          th:text="${sub.subcategory.name}">Subcategory</h4>
      <span th:id="'subcat-chevron-' + ${sub.subcategory.id}"
            class="text-sand/60 transition-transform duration-200 text-xs leading-none flex-shrink-0 mr-2">▼</span>
    </button>
    <div th:id="'subcat-body-' + ${sub.subcategory.id}" class="space-y-3">
      <th:block th:each="item : ${sub.items}">
        <th:block th:replace="~{delivery/fragments/menu-grid :: delivery-menu-item(item=${item},bill=${bill},billId=${billId},customerName=${customerName},locked=${locked})}"/>
      </th:block>
    </div>
  </th:block>
</th:block>

<!-- ── Single item card (reused from menu.html too) ─────────────────── -->
<th:block th:fragment="delivery-menu-item(item, bill, billId, customerName, locked)">

  <!-- Find how many of this item are already in the cart -->
  <th:block th:with="matchedItems=${bill.items.?[menuItem.id == __${item.id}__]},
                     cartQty=${#lists.isEmpty(matchedItems) ? 0 : matchedItems[0].quantity}">

  <div th:classappend="${!item.available} ? 'opacity-50' : ''"
       class="bg-surface rounded-xl border border-elevated/60 overflow-hidden flex gap-3 p-3">

    <!-- Thumbnail -->
    <div class="flex-shrink-0 w-20 h-20">
      <img th:if="${item.imagePath != null}"
           th:src="${(item.thumbnailPath != null ? item.thumbnailPath : item.imagePath) + '?v=' + item.imageVersion}"
           th:alt="${item.name}"
           th:attr="data-src=${item.imagePath + '?v=' + item.imageVersion}"
           class="w-20 h-20 object-cover rounded-lg cursor-pointer"
           onclick="openLightbox(this.src, this.dataset.src)"/>
      <div th:unless="${item.imagePath != null}"
           class="w-20 h-20 rounded-lg flex items-center justify-center bg-elevated/60"
           style="background: repeating-linear-gradient(45deg,#2A2A2A 0,#2A2A2A 4px,#333 4px,#333 8px)">
        <span class="text-2xl">🍽</span>
      </div>
    </div>

    <!-- Info -->
    <div class="flex-1 flex flex-col justify-between min-w-0">
      <div>
        <div class="flex items-start justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0 flex-1">
            <span th:replace="~{fragments/dish-type-mark :: mark(${item.dishType})}"></span>
            <p class="font-bold text-ivory text-sm leading-tight truncate" th:text="${item.name}">Item</p>
            <span th:if="${item.quantityLabel != null and !#strings.isEmpty(item.quantityLabel)}"
                  class="px-1.5 py-0.5 text-[10px] rounded-full border border-sand/30
                         text-sand bg-sand/10 flex-shrink-0" th:text="${item.quantityLabel}"></span>
          </div>
          <span class="font-heading text-accent text-xl tracking-wide flex-shrink-0"
                th:text="'₹' + ${item.price}">₹0</span>
        </div>
        <div th:if="${item.description != null and !#strings.isEmpty(item.description)}" class="mt-0.5">
          <p class="text-sand text-xs leading-snug line-clamp-2" th:text="${item.description}">Description</p>
          <button type="button" class="desc-toggle hidden text-accent text-[10px] font-semibold mt-0.5"
                  onclick="toggleDesc(this)">Show more</button>
        </div>
        <p th:unless="${item.available}"
           class="text-xs text-amber-400/80 mt-0.5">Currently Unavailable</p>
      </div>
      <div class="flex items-center justify-end gap-2 mt-1">

        <!-- Locked: static quantity badge only -->
        <span th:if="${locked and cartQty != null and cartQty > 0}"
              class="text-ivory text-sm font-bold" th:text="'x' + ${cartQty}">x1</span>

        <!-- Add / Qty stepper (only while still editable) -->
        <div th:if="${item.available and !locked}">

          <!-- Item not in cart: show Add button (opens qty-confirmation modal) -->
          <form th:unless="${cartQty != null and cartQty > 0}"
                th:attr="hx-post=@{/order/{id}/items(id=${billId})},data-item-name=${item.name}"
                hx-target="#order-panel"
                hx-swap="innerHTML"
                style="display:inline">
            <input type="hidden" name="menuItemId"   th:value="${item.id}"/>
            <input type="hidden" name="quantity"     value="1"/>
            <input type="hidden" name="customerName" th:value="${customerName}"/>
            <button type="button"
                    onclick="openQtyModal(this)"
                    class="px-4 py-2 bg-accent rounded-lg text-base text-xs font-bold
                           hover:brightness-110 transition-all active:scale-95
                           disabled:opacity-50 disabled:pointer-events-none">
              + Add
            </button>
          </form>

          <!-- Item already in cart: show qty stepper -->
          <div th:if="${cartQty > 0}"
               class="flex items-center gap-2">
            <th:block th:with="billItemId=${matchedItems[0].id}">
            <!-- Decrease (DRAFT only — items can't be reduced/removed once placed) -->
            <button th:if="${bill.status.name() == 'DRAFT'}"
                    th:attr="hx-patch=@{/order/{id}/items/{i}/quantity(id=${billId},i=${billItemId},quantity=${cartQty - 1},customerName=${customerName})}"
                    hx-target="#order-panel"
                    hx-swap="innerHTML"
                    class="w-8 h-8 rounded-lg border border-elevated/60 text-ivory text-lg
                           hover:border-red-400/40 hover:text-red-400 transition-colors flex items-center justify-center">−</button>
            <span class="text-ivory font-bold text-sm w-5 text-center" th:text="${cartQty}">1</span>
            <button th:attr="hx-patch=@{/order/{id}/items/{i}/quantity(id=${billId},i=${billItemId},quantity=${cartQty + 1},customerName=${customerName})}"
                    hx-target="#order-panel"
                    hx-swap="innerHTML"
                    class="w-8 h-8 rounded-lg bg-accent text-base text-lg font-bold
                           hover:brightness-110 transition-all flex items-center justify-center">+</button>
            </th:block>
          </div>
        </div>
      </div>
    </div>
  </div>

  </th:block>
</th:block>

</body>
</html>
