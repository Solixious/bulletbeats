<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<th:block th:fragment="confirm-result">
  <div class="bg-surface border-t border-elevated/60 rounded-t-2xl shadow-2xl">

    <!-- Success card -->
    <div class="px-5 pt-6 pb-4">
      <div class="rounded-xl border border-emerald-500/30 bg-emerald-500/10 px-5 py-5 text-center">
        <div class="text-3xl mb-2">🛵</div>
        <p class="font-heading text-emerald-400 text-2xl tracking-wide">Order Placed!</p>
        <p class="text-emerald-400/70 text-sm mt-1">We've got your order. Staff will call you to confirm delivery.</p>
      </div>
    </div>

    <!-- Order summary -->
    <div class="px-5 pb-3 space-y-1 text-sm border-t border-elevated/40 pt-3">
      <div class="flex justify-between text-sand/70 text-xs" th:if="${bill.deliveryFee.compareTo(T(java.math.BigDecimal).ZERO) > 0}">
        <span>Delivery Fee</span>
        <span th:text="'₹' + ${bill.deliveryFee}">₹0</span>
      </div>
      <div class="flex justify-between text-sand">
        <span>Total</span>
        <span class="text-accent font-heading text-lg" th:text="'₹' + ${bill.totalAmount}">₹0</span>
      </div>
      <div class="flex justify-between text-sand/60 text-xs">
        <span th:text="'Bill #' + ${bill.billNumber}">Bill #BB-</span>
        <span>Cash on delivery</span>
      </div>
      <div th:if="${bill.deliveryAddress != null}" class="text-sand/60 text-xs pt-1" th:text="'📍 ' + ${bill.deliveryAddress}">
        Delivery address
      </div>
    </div>

    <!-- Activity log (last 5 entries) -->
    <div th:if="${logs != null and !#lists.isEmpty(logs)}"
         class="px-5 pb-4 border-t border-elevated/40 pt-3">
      <p class="text-sand/60 text-xs uppercase tracking-widest mb-2">Activity</p>
      <div class="space-y-1">
        <div th:each="log : ${logs}"
             class="text-sand/50 text-xs leading-relaxed"
             th:text="${log.message}">log entry</div>
      </div>
    </div>

    <p class="px-5 pb-6 pt-2 text-center text-sand/40 text-xs">
      This order is confirmed and can no longer be changed here — please call the café if you need to make changes.
    </p>

  </div>
</th:block>

</body>
</html>
