<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="customer-search-results">

  <div th:if="${!#lists.isEmpty(customers)}"
       class="bg-elevated rounded-lg border border-elevated/60 divide-y divide-elevated/40 overflow-hidden mt-2">
    <button th:each="c : ${customers}"
            type="button"
            th:attr="onclick='selectTiffinCustomer(' + ${c.id} + ', &quot;' + ${c.name} + '&quot;, &quot;' + ${c.phone} + '&quot;)'"
            class="w-full text-left px-4 py-2.5 hover:bg-elevated/60 transition-colors flex items-center gap-3">
      <div class="flex-1 min-w-0">
        <p class="text-ivory text-sm truncate" th:text="${c.name}"></p>
        <p class="text-sand text-xs" th:text="${c.phone}"></p>
      </div>
      <span th:if="${c.vip}"
            class="flex-shrink-0 px-1.5 py-0.5 text-xs rounded-full font-bold
                   text-amber-400 border border-amber-400/40 bg-amber-400/10">VIP</span>
    </button>
  </div>

  <div th:if="${#lists.isEmpty(customers) and q != null and !#strings.isEmpty(q)}"
       class="mt-2 px-4 py-4 rounded-lg bg-elevated/40 border border-dashed border-sand/30">
    <p class="text-sand text-xs mb-3">No customer found for "<span class="text-ivory" th:text="${q}"></span>". Add them now:</p>
    <form hx-post="/tiffin/quick-create-customer"
          hx-target="#customer-search-results"
          hx-swap="innerHTML"
          class="space-y-2">
      <input type="text" name="name" th:value="${q}" placeholder="Full name" required
             class="w-full bg-elevated border border-elevated/60 focus:border-accent
                    rounded-lg px-3 py-2 text-ivory text-sm placeholder-sand/40
                    outline-none transition-all duration-200 focus:shadow-neon-sm"/>
      <input type="text" name="phone" placeholder="Phone number" required
             class="w-full bg-elevated border border-elevated/60 focus:border-accent
                    rounded-lg px-3 py-2 text-ivory text-sm placeholder-sand/40
                    outline-none transition-all duration-200 focus:shadow-neon-sm"/>
      <div class="flex items-center gap-3 pt-1">
        <button type="submit"
                class="px-4 py-1.5 rounded-lg bg-accent text-base text-xs font-heading
                       tracking-widest hover:brightness-110 transition-all duration-200">
          ADD CUSTOMER
        </button>
        <button type="button"
                onclick="document.getElementById('customer-search-results').innerHTML = ''"
                class="text-sand text-xs hover:text-ivory transition-colors">
          Cancel
        </button>
      </div>
    </form>
  </div>

</th:block>

<th:block th:fragment="quick-create-success">
  <script th:inline="javascript">
    selectTiffinCustomer([[${customer.id}]], [[${customer.name}]], [[${customer.phone}]]);
  </script>
</th:block>

<th:block th:fragment="quick-create-error">
  <div class="mt-2 px-3 py-2 rounded-lg bg-red-900/30 border border-red-500/40 text-red-400 text-xs"
       th:text="${error}"></div>
</th:block>

</body>
</html>
