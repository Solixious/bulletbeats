<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: shell(~{::title}, ~{::main})}">
<head>
  <title>Prepared Items — Bullet Beats Café</title>
</head>
<body>
<main class="p-6 max-w-6xl mx-auto">

  <div class="flex flex-wrap items-start justify-between gap-y-3 mb-6">
    <div>
      <h1 class="font-heading text-3xl text-ivory tracking-wide">Prepared Items</h1>
      <p class="text-sand text-sm mt-0.5">
        In-house batch-prepped ingredients (e.g. frozen momo, ginger-garlic paste) made from inventory items
      </p>
    </div>
    <a href="/admin/prepared-items/new"
       class="flex items-center gap-2 px-4 py-2 rounded-lg bg-accent text-base
              font-heading tracking-widest text-sm
              hover:shadow-neon hover:brightness-110 transition-all duration-200">
      + NEW PREPARED ITEM
    </a>
  </div>

  <div th:if="${param.created}"
       class="mb-4 px-4 py-3 rounded-lg bg-elevated border border-accent/30 text-accent text-sm">
    Prepared item created.
  </div>
  <div th:if="${param.deleted}"
       class="mb-4 px-4 py-3 rounded-lg bg-elevated border border-accent/30 text-accent text-sm">
    Prepared item deleted.
  </div>

  <div class="bg-surface rounded-xl overflow-hidden border border-elevated/60">

    <div th:if="${#lists.isEmpty(items)}" class="py-16 text-center text-sand text-sm">
      No prepared items yet.
      <a href="/admin/prepared-items/new" class="text-accent hover:underline ml-1">Add one?</a>
    </div>

    <table th:unless="${#lists.isEmpty(items)}" class="w-full text-left">
      <thead>
        <tr class="border-b border-elevated/60 text-sand text-xs uppercase tracking-widest">
          <th class="px-4 py-3 font-medium">Name</th>
          <th class="px-4 py-3 font-medium">Unit</th>
          <th class="px-4 py-3 font-medium">Batch Yield</th>
          <th class="px-4 py-3 font-medium">Stock</th>
          <th class="px-4 py-3 font-medium">Status</th>
          <th class="px-4 py-3 font-medium">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="item : ${items}"
            th:classappend="${item.lowStock}
                            ? 'border-l-4 border-amber-500 bg-amber-500/5 border-b border-b-elevated/40'
                            : 'border-b border-elevated/40 hover:bg-elevated/20'"
            class="transition-colors duration-100">

          <td class="px-4 py-3">
            <a th:href="@{/admin/prepared-items/{id}(id=${item.id})}"
               class="text-ivory text-sm font-medium hover:text-accent transition-colors"
               th:text="${item.name}">Name</a>
          </td>
          <td class="px-4 py-3 text-sand text-sm font-mono" th:text="${item.unit}"></td>
          <td class="px-4 py-3 text-sand text-sm font-mono"
              th:text="${#numbers.formatDecimal(item.batchYieldQuantity,1,3)} + ' ' + ${item.unit}"></td>
          <td class="px-4 py-3">
            <span class="font-mono text-sm font-bold"
                  th:classappend="${item.lowStock} ? 'text-red-400' : 'text-ivory'"
                  th:text="${#numbers.formatDecimal(item.quantityInStock, 1, 3)}"></span>
          </td>
          <td class="px-4 py-3">
            <span th:if="${item.lowStock}"
                  class="px-2 py-0.5 text-xs border rounded-full font-bold uppercase
                         text-amber-400 border-amber-400/40 bg-amber-400/10">Low Stock</span>
            <span th:unless="${item.lowStock}"
                  class="px-2 py-0.5 text-xs border rounded-full font-bold uppercase
                         text-emerald-400 border-emerald-400/40 bg-emerald-400/10">OK</span>
          </td>
          <td class="px-4 py-3">
            <div class="flex items-center gap-2">
              <a th:href="@{/admin/prepared-items/{id}(id=${item.id})}"
                 class="text-xs px-2.5 py-1 rounded border border-sand/30 text-sand
                        hover:border-ivory/40 hover:text-ivory transition-colors">View</a>
              <a th:href="@{/admin/prepared-items/{id}/edit(id=${item.id})}"
                 class="text-xs px-2.5 py-1 rounded border border-sand/30 text-sand
                        hover:border-ivory/40 hover:text-ivory transition-colors">Edit</a>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</main>
</body>
</html>
