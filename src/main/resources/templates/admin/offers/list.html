<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{::title}, ~{::main})}">
<head>
  <title>Offers — Bullet Beats Café</title>
</head>
<body>
<main class="p-6 max-w-5xl mx-auto">

  <div class="flex flex-wrap items-start justify-between gap-y-3 mb-6">
    <div>
      <h1 class="font-heading text-3xl text-ivory tracking-wide">Offers</h1>
      <p class="text-sand text-sm mt-0.5">Bill-level, item-level and BOGO discounts, targeted at customers or cohorts</p>
    </div>
    <a href="/admin/offers/new"
       class="flex items-center gap-2 px-4 py-2 rounded-lg bg-accent text-base
              font-heading tracking-widest text-sm
              hover:shadow-neon hover:brightness-110 transition-all duration-200">
      + NEW OFFER
    </a>
  </div>

  <div th:if="${param.created}" class="mb-4 px-4 py-3 rounded-lg bg-elevated border border-accent/30 text-accent text-sm">
    Offer created.
  </div>
  <div th:if="${param.updated}" class="mb-4 px-4 py-3 rounded-lg bg-elevated border border-accent/30 text-accent text-sm">
    Offer updated.
  </div>
  <div th:if="${param.deleted}" class="mb-4 px-4 py-3 rounded-lg bg-elevated border border-accent/30 text-accent text-sm">
    Offer deleted.
  </div>
  <div th:if="${deleteError}" class="mb-4 px-4 py-3 rounded-lg bg-elevated border border-red-500/40 text-red-400 text-sm"
       th:text="${deleteError}"></div>

  <div th:if="${#lists.isEmpty(offers)}"
       class="py-16 text-center text-sand text-sm bg-surface rounded-xl border border-elevated/60">
    No offers yet. <a href="/admin/offers/new" class="text-accent hover:underline ml-1">Create one?</a>
  </div>

  <div th:unless="${#lists.isEmpty(offers)}" class="bg-surface rounded-xl border border-elevated/60 overflow-hidden">
    <div th:each="offer : ${offers}"
         th:classappend="${!offer.active} ? 'opacity-60' : ''"
         class="grid grid-cols-[1fr_8rem_8rem_6rem_auto] items-center gap-3 px-4 py-3
                border-b border-elevated/60 last:border-0 hover:bg-elevated/20 transition-colors duration-100">
      <span>
        <span class="text-ivory text-sm font-medium" th:text="${offer.name}">Offer name</span>
        <span th:if="${offer.isSystem}"
              class="ml-2 px-1.5 py-0.5 text-[10px] rounded-full border border-blue-400/40 text-blue-400 uppercase">System</span>
        <span th:if="${offer.requiresCode}"
              class="ml-2 px-1.5 py-0.5 text-[10px] rounded-full border border-sand/30 text-sand uppercase">Code required</span>
        <span th:unless="${offer.active}"
              class="ml-2 px-1.5 py-0.5 text-[10px] rounded-full border border-sand/30 text-sand uppercase">Inactive</span>
      </span>
      <span class="text-sand text-xs" th:text="${offer.mechanism}">MECHANISM</span>
      <span class="text-sand text-xs" th:text="${offer.targetType}">TARGET</span>
      <span class="text-sand text-xs"
            th:text="${offer.endsAt != null} ? ${#temporals.format(offer.endsAt, 'dd MMM yyyy')} : 'No expiry'"></span>
      <span class="flex items-center gap-2 justify-end">
        <a th:href="@{/admin/offers/{id}/edit(id=${offer.id})}"
           class="text-xs px-2.5 py-1 rounded border border-sand/30 text-sand
                  hover:border-ivory/40 hover:text-ivory transition-colors">
          Edit
        </a>
        <form th:unless="${offer.isSystem}"
              th:action="@{/admin/offers/{id}/toggle-active(id=${offer.id})}" method="post" class="inline">
          <button type="submit"
                  class="text-xs px-2.5 py-1 rounded border border-sand/30 text-sand
                         hover:border-accent/40 hover:text-accent transition-colors"
                  th:text="${offer.active} ? 'Deactivate' : 'Activate'">Toggle</button>
        </form>
        <form th:unless="${offer.isSystem}"
              th:action="@{/admin/offers/{id}/delete(id=${offer.id})}" method="post" class="inline"
              onsubmit="return bbConfirm(this, 'Delete this offer? This cannot be undone.')">
          <button type="submit"
                  class="text-xs px-2.5 py-1 rounded border border-red-500/50 text-red-400
                         hover:border-red-500/80 hover:bg-red-500/10 transition-colors">
            Delete
          </button>
        </form>
      </span>
    </div>
  </div>

</main>
</body>
</html>
