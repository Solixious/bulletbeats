<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{::title}, ~{::main})}">
<head>
  <title>Customer Cohorts — Bullet Beats Café</title>
</head>
<body>
<main class="p-6 max-w-4xl mx-auto">

  <div class="flex flex-wrap items-start justify-between gap-y-3 mb-6">
    <div>
      <h1 class="font-heading text-3xl text-ivory tracking-wide">Customer Cohorts</h1>
      <p class="text-sand text-sm mt-0.5">Rule-based customer segments used to target offers</p>
    </div>
    <a href="/admin/cohorts/new"
       class="flex items-center gap-2 px-4 py-2 rounded-lg bg-accent text-base
              font-heading tracking-widest text-sm
              hover:shadow-neon hover:brightness-110 transition-all duration-200">
      + NEW COHORT
    </a>
  </div>

  <div th:if="${param.created}" class="mb-4 px-4 py-3 rounded-lg bg-elevated border border-accent/30 text-accent text-sm">
    Cohort created.
  </div>
  <div th:if="${param.updated}" class="mb-4 px-4 py-3 rounded-lg bg-elevated border border-accent/30 text-accent text-sm">
    Cohort updated.
  </div>
  <div th:if="${param.deleted}" class="mb-4 px-4 py-3 rounded-lg bg-elevated border border-accent/30 text-accent text-sm">
    Cohort deleted.
  </div>
  <div th:if="${deleteError}" class="mb-4 px-4 py-3 rounded-lg bg-elevated border border-red-500/40 text-red-400 text-sm"
       th:text="${deleteError}"></div>

  <div class="bg-surface rounded-xl border border-elevated/60 overflow-hidden">
    <div th:each="cohort : ${cohorts}"
         class="grid grid-cols-[1fr_10rem_6rem_auto] items-center gap-3 px-4 py-3
                border-b border-elevated/60 last:border-0 hover:bg-elevated/20 transition-colors duration-100">
      <span>
        <span class="text-ivory text-sm font-medium" th:text="${cohort.name}">Cohort name</span>
        <span th:if="${cohort.builtIn}"
              class="ml-2 px-1.5 py-0.5 text-[10px] rounded-full border border-blue-400/40 text-blue-400 uppercase">Built-in</span>
        <p class="text-sand text-xs mt-0.5" th:text="${cohort.description} ?: '—'"></p>
      </span>
      <span class="text-sand text-xs"
            th:text="${#lists.isEmpty(cohort.rules)} ? 'No conditions' : (${#lists.size(cohort.rules)} + ' condition(s)')"></span>
      <span class="text-sand text-xs" th:text="${cohort.active} ? 'Active' : 'Inactive'"></span>
      <span class="flex items-center gap-2 justify-end">
        <a th:href="@{/admin/cohorts/{id}/edit(id=${cohort.id})}"
           class="text-xs px-2.5 py-1 rounded border border-sand/30 text-sand
                  hover:border-ivory/40 hover:text-ivory transition-colors">
          Edit
        </a>
        <form th:unless="${cohort.builtIn}"
              th:action="@{/admin/cohorts/{id}/delete(id=${cohort.id})}" method="post" class="inline"
              onsubmit="return bbConfirm(this, 'Delete this cohort?')">
          <button type="submit"
                  class="text-xs px-2.5 py-1 rounded border border-red-500/50 text-red-400
                         hover:border-red-500/80 hover:bg-red-500/10 transition-colors">
            Delete
          </button>
        </form>
      </span>
    </div>
  </div>

</main>
</body>
</html>
