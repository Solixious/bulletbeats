<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell(~{::title}, ~{::main})}">
<head>
  <title>Online Platforms — Bullet Beats Café</title>
</head>
<body>
<main class="p-6 max-w-4xl mx-auto">

  <!-- Header -->
  <div class="flex flex-wrap items-start justify-between gap-y-3 mb-6">
    <div>
      <h1 class="font-heading text-3xl text-ivory tracking-wide">Online Platforms</h1>
      <p class="text-sand text-sm mt-0.5">Manage the delivery platforms you take online orders on</p>
    </div>
    <a href="/admin/platforms/new"
       class="flex items-center gap-2 px-4 py-2 rounded-lg bg-accent text-base
              font-heading tracking-widest text-sm
              hover:shadow-neon hover:brightness-110 transition-all duration-200">
      + ADD PLATFORM
    </a>
  </div>

  <!-- Flash messages -->
  <div th:if="${param.created}"
       class="mb-4 px-4 py-3 rounded-lg bg-elevated border border-accent/30 text-accent text-sm">
    Platform created.
  </div>
  <div th:if="${param.updated}"
       class="mb-4 px-4 py-3 rounded-lg bg-elevated border border-accent/30 text-accent text-sm">
    Platform updated.
  </div>
  <div th:if="${param.activated}"
       class="mb-4 px-4 py-3 rounded-lg bg-elevated border border-accent/30 text-accent text-sm">
    Platform activated.
  </div>
  <div th:if="${param.deactivated}"
       class="mb-4 px-4 py-3 rounded-lg bg-elevated border border-accent/30 text-accent text-sm">
    Platform deactivated.
  </div>

  <!-- Table -->
  <div class="bg-surface rounded-xl overflow-hidden border border-elevated/60">

    <div th:if="${#lists.isEmpty(platforms)}"
         class="py-16 text-center text-sand text-sm">
      No platforms yet.
      <a href="/admin/platforms/new" class="text-accent hover:underline ml-1">Add one?</a>
    </div>

    <table th:unless="${#lists.isEmpty(platforms)}" class="w-full text-left">
      <thead>
        <tr class="border-b border-elevated/60 text-sand text-xs uppercase tracking-widest">
          <th class="px-4 py-3 font-medium">Name</th>
          <th class="px-4 py-3 font-medium">Status</th>
          <th class="px-4 py-3 font-medium">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="p : ${platforms}"
            class="border-b border-elevated/40 last:border-0 hover:bg-elevated/20 transition-colors">

          <td class="px-4 py-3 text-ivory text-sm font-medium" th:text="${p.name}"></td>

          <td class="px-4 py-3">
            <span th:if="${p.isActive()}"
                  class="inline-flex items-center gap-1.5 px-2 py-0.5 text-xs border rounded-full
                         text-emerald-400 border-emerald-400/40 bg-emerald-400/10">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Active
            </span>
            <span th:unless="${p.isActive()}"
                  class="inline-flex items-center gap-1.5 px-2 py-0.5 text-xs border rounded-full
                         text-sand border-sand/40 bg-sand/10">
              <span class="w-1.5 h-1.5 rounded-full bg-sand"></span> Inactive
            </span>
          </td>

          <td class="px-4 py-3">
            <div class="flex items-center gap-2 flex-wrap">
              <a th:href="@{/admin/platforms/{id}/edit(id=${p.id})}"
                 class="text-xs px-2.5 py-1 rounded border border-sand/30 text-sand
                        hover:border-ivory/40 hover:text-ivory transition-colors">
                Edit
              </a>
              <form th:if="${p.isActive()}"
                    th:action="@{/admin/platforms/{id}/deactivate(id=${p.id})}" method="post"
                    class="inline"
                    onsubmit="return bbConfirm(this, 'Deactivate ' + this.dataset.name + '?')"
                    th:attr="data-name=${p.name}">
                <button type="submit"
                        class="text-xs px-2.5 py-1 rounded border border-red-500/40 text-red-400
                               hover:bg-red-500/10 transition-colors cursor-pointer">
                  Deactivate
                </button>
              </form>
              <form th:unless="${p.isActive()}"
                    th:action="@{/admin/platforms/{id}/activate(id=${p.id})}" method="post"
                    class="inline">
                <button type="submit"
                        class="text-xs px-2.5 py-1 rounded border border-accent/40 text-accent
                               hover:bg-accent/10 transition-colors cursor-pointer">
                  Activate
                </button>
              </form>
            </div>
          </td>

        </tr>
      </tbody>
    </table>

  </div>

</main>
</body>
</html>
